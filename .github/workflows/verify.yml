name: verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 引擎依赖的是科学计算栈本身，插件自己不实现统计量与绘图。
      - name: Install Python stack
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pandas scipy statsmodels matplotlib openpyxl

      - name: Static checks
        run: node --check dsh/index.js && node --check lib/client.js

      - name: Package manifest
        run: node scripts/check-package.mjs

      - name: End-to-end engine check
        env:
          MPLCONFIGDIR: ${{ runner.temp }}/mpl
        run: node scripts/verify.mjs
